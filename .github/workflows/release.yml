name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/pack-templates.mjs

      - run: pnpm typecheck
      - run: pnpm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  version:
    name: Check the version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches tauri.conf.json
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            app="v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
            if [ "$app" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} but the app version is ${app}. Run pnpm version:set first."
              exit 1
            fi
          else
            echo "Building from branch ${GITHUB_REF_NAME}"
          fi
      - name: Check updater signing key (optional)
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. Installers (.exe, .dmg, .deb, etc.) will still be built and attached to the release, but auto-updater signatures will be skipped."
          fi

  build:
    name: Release (${{ matrix.name }})
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/pack-templates.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Listune Studio v__VERSION__
          releaseBody: Download the installer for your computer below. Installed copies update themselves.
          releaseDraft: true
          prerelease: false
          # Windows updates use the NSIS installer, which runs in the "passive" mode set in tauri.conf.json.
          updaterJsonPreferNsis: true
