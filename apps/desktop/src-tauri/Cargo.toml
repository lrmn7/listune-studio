[package]
name = "listune-studio"
version = "0.0.6"
description = "Listune Studio"
edition = "2021"

[lib]
name = "listune_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sys-locale = "=0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-process = "=2.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
